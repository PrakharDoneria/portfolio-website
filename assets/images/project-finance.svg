<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bd00ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00d8ff;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#121212" />
  <rect width="400" height="300" fill="url(#grad1)" />
  
  <!-- Financial Graph -->
  <polyline points="50,200 100,150 150,180 200,100 250,120 300,80 350,60" 
    stroke="#00d8ff" stroke-width="3" fill="none" />
  
  <!-- Bar Chart -->
  <rect x="70" y="220" width="30" height="40" fill="#bd00ff" opacity="0.7" />
  <rect x="110" y="200" width="30" height="60" fill="#bd00ff" opacity="0.7" />
  <rect x="150" y="180" width="30" height="80" fill="#bd00ff" opacity="0.7" />
  <rect x="190" y="160" width="30" height="100" fill="#bd00ff" opacity="0.7" />
  <rect x="230" y="140" width="30" height="120" fill="#bd00ff" opacity="0.7" />
  
  <!-- AI Symbol -->
  <circle cx="300" cy="130" r="40" fill="none" stroke="#00ffaa" stroke-width="2" />
  <path d="M280,130 L320,130 M300,110 L300,150" stroke="#00ffaa" stroke-width="2" />
  <text x="200" y="270" font-family="Arial" font-size="16" text-anchor="middle" fill="white">AI-Powered Financial Analysis</text>
</svg>