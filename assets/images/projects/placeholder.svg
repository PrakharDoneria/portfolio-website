<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#1A1A2E" />
  
  <!-- Abstract pattern -->
  <g opacity="0.5">
    <circle cx="100" cy="100" r="80" fill="#6C63FF" opacity="0.2" />
    <circle cx="500" cy="300" r="100" fill="#FF6584" opacity="0.2" />
    <circle cx="300" cy="200" r="150" fill="#43CBFF" opacity="0.1" />
  </g>
  
  <!-- Project illustration -->
  <g transform="translate(300, 200)">
    <!-- Code window -->
    <rect x="-100" y="-70" width="200" height="140" rx="10" fill="#2A2A42" />
    <rect x="-90" y="-60" width="180" height="120" rx="5" fill="#1A1A2E" />
    
    <!-- Code lines -->
    <rect x="-80" y="-50" width="120" height="6" rx="3" fill="#6C63FF" opacity="0.7" />
    <rect x="-80" y="-35" width="90" height="6" rx="3" fill="#F5F5F7" opacity="0.5" />
    <rect x="-80" y="-20" width="150" height="6" rx="3" fill="#F5F5F7" opacity="0.5" />
    <rect x="-80" y="-5" width="80" height="6" rx="3" fill="#FF6584" opacity="0.7" />
    <rect x="-80" y="10" width="130" height="6" rx="3" fill="#F5F5F7" opacity="0.5" />
    <rect x="-80" y="25" width="100" height="6" rx="3" fill="#43CBFF" opacity="0.7" />
    <rect x="-80" y="40" width="70" height="6" rx="3" fill="#F5F5F7" opacity="0.5" />
  </g>
  
  <!-- Text label -->
  <text x="300" y="300" font-family="sans-serif" font-size="16" fill="#F5F5F7" text-anchor="middle">Project Image</text>
</svg>