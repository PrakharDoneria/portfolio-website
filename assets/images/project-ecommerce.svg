<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bd00ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00d8ff;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#121212" />
  <rect width="400" height="300" fill="url(#grad1)" />
  
  <!-- Microservices Architecture -->
  <!-- Database Icon -->
  <circle cx="100" cy="80" r="25" fill="none" stroke="#00d8ff" stroke-width="2" />
  <rect x="85" y="65" width="30" height="30" fill="none" stroke="#00d8ff" stroke-width="2" />
  <text x="100" y="85" font-family="Arial" font-size="10" text-anchor="middle" fill="#00d8ff">DB</text>
  
  <!-- API Service -->
  <rect x="180" y="50" width="40" height="40" rx="5" fill="none" stroke="#bd00ff" stroke-width="2" />
  <text x="200" y="75" font-family="Arial" font-size="10" text-anchor="middle" fill="#bd00ff">API</text>
  
  <!-- Auth Service -->
  <rect x="270" y="80" width="40" height="40" rx="5" fill="none" stroke="#bd00ff" stroke-width="2" />
  <text x="290" y="105" font-family="Arial" font-size="10" text-anchor="middle" fill="#bd00ff">AUTH</text>
  
  <!-- Payment Service -->
  <rect x="180" y="140" width="40" height="40" rx="5" fill="none" stroke="#bd00ff" stroke-width="2" />
  <text x="200" y="165" font-family="Arial" font-size="10" text-anchor="middle" fill="#bd00ff">PAY</text>
  
  <!-- User Service -->
  <rect x="90" y="150" width="40" height="40" rx="5" fill="none" stroke="#bd00ff" stroke-width="2" />
  <text x="110" y="175" font-family="Arial" font-size="10" text-anchor="middle" fill="#bd00ff">USER</text>
  
  <!-- Product Service -->
  <rect x="270" y="160" width="40" height="40" rx="5" fill="none" stroke="#bd00ff" stroke-width="2" />
  <text x="290" y="185" font-family="Arial" font-size="10" text-anchor="middle" fill="#bd00ff">PROD</text>
  
  <!-- Container Orchestration -->
  <rect x="150" y="210" width="100" height="30" rx="5" fill="none" stroke="#00ffaa" stroke-width="2" />
  <text x="200" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#00ffaa">KUBERNETES</text>
  
  <!-- Connecting Lines -->
  <line x1="100" y1="105" x2="110" y2="150" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="200" y1="90" x2="200" y2="140" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="290" y1="120" x2="290" y2="160" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="220" y1="70" x2="270" y2="100" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="130" y1="170" x2="180" y2="160" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="220" y1="160" x2="270" y2="180" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="110" y1="190" x2="150" y2="220" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="200" y1="180" x2="200" y2="210" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="290" y1="200" x2="250" y2="220" stroke="#00d8ff" stroke-width="1.5" />
  
  <text x="200" y="270" font-family="Arial" font-size="16" text-anchor="middle" fill="white">E-Commerce Microservices</text>
</svg>