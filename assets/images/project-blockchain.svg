<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bd00ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00d8ff;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#121212" />
  <rect width="400" height="300" fill="url(#grad1)" />
  
  <!-- Blockchain Network -->
  <!-- Node 1 -->
  <circle cx="100" cy="100" r="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  <rect x="90" y="90" width="20" height="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  
  <!-- Node 2 -->
  <circle cx="200" cy="80" r="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  <rect x="190" y="70" width="20" height="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  
  <!-- Node 3 -->
  <circle cx="300" cy="120" r="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  <rect x="290" y="110" width="20" height="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  
  <!-- Node 4 -->
  <circle cx="80" cy="200" r="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  <rect x="70" y="190" width="20" height="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  
  <!-- Node 5 -->
  <circle cx="200" cy="220" r="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  <rect x="190" y="210" width="20" height="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  
  <!-- Node 6 -->
  <circle cx="320" cy="200" r="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  <rect x="310" y="190" width="20" height="20" fill="none" stroke="#bd00ff" stroke-width="2" />
  
  <!-- Connections -->
  <line x1="100" y1="100" x2="200" y2="80" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="200" y1="80" x2="300" y2="120" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="300" y1="120" x2="320" y2="200" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="320" y1="200" x2="200" y2="220" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="200" y1="220" x2="80" y2="200" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="80" y1="200" x2="100" y2="100" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="100" y1="100" x2="200" y2="220" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="200" y1="80" x2="320" y2="200" stroke="#00d8ff" stroke-width="1.5" />
  <line x1="300" y1="120" x2="80" y2="200" stroke="#00d8ff" stroke-width="1.5" />
  
  <!-- Animated Data Flow -->
  <circle cx="150" cy="90" r="3" fill="#00ffaa">
    <animate attributeName="cx" values="100;200" dur="2s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;80" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="250" cy="100" r="3" fill="#00ffaa">
    <animate attributeName="cx" values="200;300" dur="3s" repeatCount="indefinite" />
    <animate attributeName="cy" values="80;120" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <text x="200" y="270" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Blockchain Integration Platform</text>
</svg>