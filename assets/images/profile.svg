<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular background -->
  <circle cx="200" cy="200" r="180" fill="#5A189A" opacity="0.8" />
  
  <!-- Abstract pattern -->
  <g opacity="0.6">
    <path d="M200,20 Q300,100 200,180 Q100,250 200,380" stroke="#9D4EDD" stroke-width="10" fill="none" />
    <path d="M100,200 Q250,150 300,200 Q350,250 200,350" stroke="#C77DFF" stroke-width="8" fill="none" />
    <path d="M50,150 Q150,50 350,150 Q300,350 50,250" stroke="#E0AAFF" stroke-width="6" fill="none" />
  </g>
  
  <!-- Stylized silhouette -->
  <g transform="translate(125, 100)">
    <!-- Head -->
    <circle cx="75" cy="70" r="60" fill="#1A1A2E" />
    
    <!-- Body -->
    <path d="M75,130 L75,260 M30,170 L120,170" stroke="#1A1A2E" stroke-width="15" stroke-linecap="round" />
    
    <!-- Coding symbols -->
    <g transform="translate(150, 180)">
      <text font-family="monospace" font-size="20" fill="#E0AAFF">&lt;/&gt;</text>
    </g>
    <g transform="translate(-20, 180)">
      <text font-family="monospace" font-size="20" fill="#E0AAFF">{...}</text>
    </g>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="80" r="10" fill="#FF9E00" opacity="0.8" />
  <circle cx="320" cy="100" r="15" fill="#FF9E00" opacity="0.8" />
  <circle cx="280" cy="320" r="12" fill="#FF9E00" opacity="0.8" />
  <circle cx="120" cy="300" r="8" fill="#FF9E00" opacity="0.8" />
</svg>