<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bd00ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00d8ff;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#121212" />
  <rect width="400" height="300" fill="url(#grad1)" />
  
  <!-- Healthcare Data Platform -->
  <!-- Central Server -->
  <rect x="170" y="120" width="60" height="60" rx="10" fill="none" stroke="#00d8ff" stroke-width="2" />
  <path d="M180,140 L220,140 M200,130 L200,150" stroke="#00d8ff" stroke-width="2" />
  <text x="200" y="170" font-family="Arial" font-size="10" text-anchor="middle" fill="#00d8ff">Data Core</text>
  
  <!-- Hospital 1 -->
  <rect x="80" y="50" width="50" height="50" rx="5" fill="none" stroke="#bd00ff" stroke-width="2" />
  <path d="M92,75 L118,75 M105,62 L105,88" stroke="#bd00ff" stroke-width="2" />
  <text x="105" y="105" font-family="Arial" font-size="10" text-anchor="middle" fill="#bd00ff">Hospital A</text>
  
  <!-- Hospital 2 -->
  <rect x="270" y="50" width="50" height="50" rx="5" fill="none" stroke="#bd00ff" stroke-width="2" />
  <path d="M282,75 L308,75 M295,62 L295,88" stroke="#bd00ff" stroke-width="2" />
  <text x="295" y="105" font-family="Arial" font-size="10" text-anchor="middle" fill="#bd00ff">Hospital B</text>
  
  <!-- Hospital 3 -->
  <rect x="80" y="200" width="50" height="50" rx="5" fill="none" stroke="#bd00ff" stroke-width="2" />
  <path d="M92,225 L118,225 M105,212 L105,238" stroke="#bd00ff" stroke-width="2" />
  <text x="105" y="255" font-family="Arial" font-size="10" text-anchor="middle" fill="#bd00ff">Hospital C</text>
  
  <!-- Hospital 4 -->
  <rect x="270" y="200" width="50" height="50" rx="5" fill="none" stroke="#bd00ff" stroke-width="2" />
  <path d="M282,225 L308,225 M295,212 L295,238" stroke="#bd00ff" stroke-width="2" />
  <text x="295" y="255" font-family="Arial" font-size="10" text-anchor="middle" fill="#bd00ff">Hospital D</text>
  
  <!-- Secure Connections -->
  <line x1="105" y1="100" x2="170" y2="140" stroke="#00ffaa" stroke-width="1.5" stroke-dasharray="5,2" />
  <line x1="295" y1="100" x2="230" y2="140" stroke="#00ffaa" stroke-width="1.5" stroke-dasharray="5,2" />
  <line x1="105" y1="200" x2="170" y2="160" stroke="#00ffaa" stroke-width="1.5" stroke-dasharray="5,2" />
  <line x1="295" y1="200" x2="230" y2="160" stroke="#00ffaa" stroke-width="1.5" stroke-dasharray="5,2" />
  
  <!-- Data Flow -->
  <circle cx="130" cy="125" r="3" fill="#bd00ff">
    <animate attributeName="cx" values="105;170" dur="2s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;140" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="265" cy="125" r="3" fill="#bd00ff">
    <animate attributeName="cx" values="295;230" dur="3s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;140" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="140" cy="175" r="3" fill="#bd00ff">
    <animate attributeName="cx" values="105;170" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="200;160" dur="2.5s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="270" cy="175" r="3" fill="#bd00ff">
    <animate attributeName="cx" values="295;230" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="cy" values="200;160" dur="2.2s" repeatCount="indefinite" />
  </circle>
  
  <text x="200" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="white">HIPAA Compliant</text>
  <text x="200" y="290" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Healthcare Data Platform</text>
</svg>